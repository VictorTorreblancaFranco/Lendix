spring:
  application.name: lendix-be
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/lendix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 1
      min-size: 1
      max-size: 6
      max-idle-time: 30m
      max-life-time: 5m
      max-acquire-time: 10s
      max-create-connection-time: 10s
      max-validation-time: 3s
      validation-query: SELECT 1
  flyway:
    enabled: true
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5432/lendix}
    user: ${FLYWAY_USER:postgres}
    password: ${FLYWAY_PASSWORD:postgres}
  jackson.time-zone: America/Lima
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info

