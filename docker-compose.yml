services:
  backend:
    build: ./lendix-be
    environment:
      LENDIX_AUTH_REQUIRED: "false"
      LENDIX_ADMIN_USERNAME: ${LENDIX_ADMIN_USERNAME:-admin}
      LENDIX_ADMIN_PASSWORD: ${LENDIX_ADMIN_PASSWORD:-Admin123@}
      SERVER_PORT: 18080
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FLYWAY_URL: ${FLYWAY_URL}
      FLYWAY_USER: ${FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
    ports: ["18080:18080"]
    restart: unless-stopped
  frontend:
    build: ./lendix-fe
    depends_on: [backend]
    ports: ["4200:80"]
    restart: unless-stopped
